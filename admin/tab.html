<!doctype html>
<html>
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Pi Agent</title>
        <script src="../../lib/js/socket.io.js"></script>
        <style>
            :root {
                --bg: #ffffff;
                --panel: #f5f5f5;
                --text: #1f1f1f;
                --muted: #6b6b6b;
                --border: #dddddd;
                --accent: #1e6fd9;
                --accent-bg: #e3eefc;
                --accent-text: #0c3f80;
                --warn: #b26a00;
                --warn-bg: #fff4e0;
                --error: #b3261e;
                --error-bg: #fdecea;
            }
            body.dark {
                --bg: #1e1e1e;
                --panel: #2a2a2a;
                --text: #e6e6e6;
                --muted: #a0a0a0;
                --border: #3d3d3d;
                --accent: #6ea8fe;
                --accent-bg: #1f3554;
                --accent-text: #d6e6ff;
                --warn: #ffb74d;
                --warn-bg: #3d2e12;
                --error: #f28b82;
                --error-bg: #3c1f1d;
            }
            * {
                box-sizing: border-box;
            }
            [hidden] {
                display: none !important;
            }
            html,
            body {
                height: 100%;
                margin: 0;
            }
            body {
                display: flex;
                flex-direction: column;
                background: var(--bg);
                color: var(--text);
                font: 14px/1.5 Roboto, 'Segoe UI', Arial, sans-serif;
            }
            header {
                display: flex;
                align-items: center;
                gap: 10px;
                padding: 10px 16px;
                border-bottom: 1px solid var(--border);
            }
            header .title {
                font-weight: 500;
                font-size: 16px;
            }
            header .info {
                color: var(--muted);
                font-size: 12px;
            }
            header .spacer {
                flex: 1;
            }
            .badge {
                background: var(--warn-bg);
                color: var(--warn);
                border-radius: 10px;
                padding: 1px 8px;
                font-size: 12px;
            }
            button {
                font: inherit;
                color: var(--text);
                background: transparent;
                border: 1px solid var(--border);
                border-radius: 6px;
                padding: 5px 12px;
                cursor: pointer;
            }
            button:hover:not(:disabled) {
                background: var(--panel);
            }
            button:disabled {
                opacity: 0.5;
                cursor: default;
            }
            button.primary {
                background: var(--accent);
                border-color: var(--accent);
                color: #ffffff;
            }
            #messages {
                flex: 1;
                overflow-y: auto;
                padding: 16px;
                display: flex;
                flex-direction: column;
                gap: 10px;
            }
            .msg {
                max-width: min(760px, 85%);
                padding: 8px 12px;
                border-radius: 12px;
                white-space: pre-wrap;
                overflow-wrap: anywhere;
            }
            .user {
                align-self: flex-end;
                background: var(--accent-bg);
                color: var(--accent-text);
            }
            .assistant {
                align-self: flex-start;
                background: var(--panel);
                border: 1px solid var(--border);
            }
            .notice {
                align-self: flex-start;
                background: var(--warn-bg);
                color: var(--warn);
            }
            .tool {
                align-self: flex-start;
                color: var(--muted);
                font-size: 12px;
                font-family: Consolas, monospace;
            }
            .tool::before {
                content: '\2699\FE0E  ';
            }
            .tool .result {
                color: var(--text);
                opacity: 0.75;
            }
            .tool .ms,
            .summary {
                color: var(--muted);
            }
            .tool.failed {
                color: var(--error);
            }
            .summary {
                align-self: flex-start;
                font-size: 12px;
                margin-top: -6px;
            }
            .summary .provider {
                background: var(--accent);
                color: #ffffff;
                border-radius: 8px;
                padding: 0 6px;
                margin-right: 6px;
            }
            .readonly {
                align-self: stretch;
                text-align: center;
                font-size: 12px;
                color: var(--muted);
                border: 1px dashed var(--border);
                border-radius: 6px;
                padding: 4px;
            }
            header select {
                font: inherit;
                color: var(--text);
                background: var(--bg);
                border: 1px solid var(--border);
                border-radius: 6px;
                padding: 4px 6px;
                max-width: 260px;
            }
            header label {
                display: flex;
                align-items: center;
                gap: 4px;
                color: var(--muted);
                font-size: 13px;
                cursor: pointer;
            }
            .error {
                align-self: stretch;
                background: var(--error-bg);
                color: var(--error);
            }
            .question {
                align-self: flex-start;
                background: var(--panel);
                border: 1px solid var(--warn);
            }
            .question pre {
                max-height: 50vh;
                overflow: auto;
            }
            .question .buttons {
                display: flex;
                gap: 8px;
                margin-top: 8px;
            }
            .hint,
            .thinking {
                align-self: center;
                color: var(--muted);
            }
            .thinking {
                align-self: flex-start;
            }
            .msg pre {
                margin: 4px 0;
                padding: 6px 8px;
                background: var(--bg);
                border-radius: 6px;
                overflow-x: auto;
                white-space: pre;
            }
            .msg code {
                font-family: Consolas, monospace;
            }
            .msg a {
                color: var(--accent);
            }
            footer {
                display: flex;
                gap: 8px;
                padding: 10px 16px;
                border-top: 1px solid var(--border);
            }
            #jobs {
                margin: 10px 16px 0;
                border: 1px solid var(--border);
                border-radius: 8px;
            }
            #jobs .head {
                display: flex;
                align-items: center;
                gap: 8px;
                padding: 6px 12px;
                cursor: pointer;
                user-select: none;
            }
            #jobs .head .count {
                color: var(--muted);
            }
            #jobs.collapsed .job {
                display: none;
            }
            .job {
                display: flex;
                align-items: center;
                gap: 10px;
                padding: 8px 12px;
                border-top: 1px solid var(--border);
                font-size: 13px;
            }
            .job .text {
                flex: 1;
                min-width: 0;
            }
            .job .name {
                font-weight: 500;
                font-size: 14px;
            }
            .job .triggers {
                color: var(--muted);
                overflow-wrap: anywhere;
            }
            .job .meta {
                color: var(--muted);
                font-size: 12px;
            }
            .job .status {
                border-radius: 10px;
                padding: 0 8px;
                margin-left: 6px;
                font-size: 12px;
                background: var(--accent-bg);
                color: var(--accent-text);
            }
            .job .status.paused {
                background: var(--warn-bg);
                color: var(--warn);
            }
            .job .buttons {
                display: flex;
                gap: 6px;
            }
            textarea {
                flex: 1;
                resize: none;
                font: inherit;
                color: var(--text);
                background: var(--bg);
                border: 1px solid var(--border);
                border-radius: 6px;
                padding: 7px 10px;
                max-height: 160px;
            }
        </style>
    </head>
    <body>
        <header>
            <span class="title">Pi Agent</span>
            <span class="info" id="model"></span>
            <span class="badge" id="simulation" hidden></span>
            <span class="spacer"></span>
            <select id="conversation" hidden></select>
            <label><input type="checkbox" id="details" /> <span id="detailsLabel"></span></label>
            <button id="new"></button>
        </header>
        <section id="jobs" hidden></section>
        <div id="messages"></div>
        <footer>
            <textarea id="input" rows="1"></textarea>
            <button class="primary" id="send"></button>
        </footer>

                jobStop: ['Stop', 'Stoppen', 'Стоп', 'Parar', 'Stoppen', 'Arrêter', 'Ferma', 'Detener', 'Zatrzymaj', 'Стоп', '停止'],
                jobResume: ['Resume', 'Fortsetzen', 'Продолжить', 'Retomar', 'Hervatten', 'Reprendre', 'Riprendi', 'Reanudar', 'Wznów', 'Продовжити', '继续'],
                confirmJobStop: ['Stop the job "%name"?', 'Den Auftrag „%name“ stoppen?', 'Остановить задание «%name»?', 'Parar a tarefa "%name"?', 'De taak "%name" stoppen?', 'Arrêter la tâche « %name » ?', 'Fermare l\'attività "%name"?', '¿Detener la tarea "%name"?', 'Zatrzymać zadanie „%name”?', 'Зупинити завдання «%name»?', '停止任务“%name”？'],
                jobUntil: ['until %t', 'bis %t', 'до %t', 'até %t', 'tot %t', "jusqu'au %t", 'fino al %t', 'hasta el %t', 'do %t', 'до %t', '至 %t'],
                jobToday: ['today %n of %m', 'heute %n von %m', 'сегодня %n из %m', 'hoje %n de %m', 'vandaag %n van %m', "aujourd'hui %n sur %m", 'oggi %n di %m', 'hoy %n de %m', 'dziś %n z %m', 'сьогодні %n з %m', '今天 %n / %m'],
                jobLast: ['last %t', 'zuletzt %t', 'последнее %t', 'último %t', 'laatst %t', 'dernier %t', 'ultimo %t', 'último %t', 'ostatnio %t', 'останнє %t', '上次 %t'],
                triggerDaily: ['every day at %t', 'täglich um %t', 'каждый день в %t', 'todos os dias às %t', 'elke dag om %t', 'chaque jour à %t', 'ogni giorno alle %t', 'cada día a las %t', 'codziennie o %t', 'щодня о %t', '每天 %t'],
                triggerInterval: ['every %n min', 'alle %n min', 'каждые %n мин', 'a cada %n min', 'elke %n min', 'toutes les %n min', 'ogni %n min', 'cada %n min', 'co %n min', 'кожні %n хв', '每 %n 分钟'],
                triggerFor: ['for %n min', 'für %n min', '%n мин', 'durante %n min', '%n min lang', 'pendant %n min', 'per %n min', 'durante %n min', 'przez %n min', '%n хв', '持续 %n 分钟'],
                voice: ['voice', 'Sprache', 'голос', 'voz', 'spraak', 'voix', 'voce', 'voz', 'głos', 'голос', '语音'],
                calls: ['%n model call(s)', '%n Modellaufruf(e)', 'вызовов модели: %n', '%n chamada(s) do modelo', '%n modelaanroep(en)', '%n appel(s) du modèle', '%n chiamata/e al modello', '%n llamada(s) al modelo', 'wywołania modelu: %n', 'викликів моделі: %n', '%n 次模型调用'],
            };
            let lang = 'en';
            const t = key => {
                const texts = TEXTS[key];
                return texts[LANGS.indexOf(lang)] || texts[0];
            };

            // admin opens the tab as "tab.html?<instance>&react=<theme>"
            const args = (location.search || '').replace(/^\?/, '').split('&').filter(Boolean);
            const instance = /^\d+$/.test(args[0] || '') ? args[0] : '0';
            const theme = (args.find(a => a.startsWith('react=')) || '').slice(6);
            const darkThemes = ['dark', 'blue', 'modernDark', 'NW', 'HA'];
            if (theme ? darkThemes.includes(theme) : matchMedia('(prefers-color-scheme: dark)').matches) {
                document.body.classList.add('dark');
            }

            const $ = id => document.getElementById(id);
            const messages = $('messages');
            const input = $('input');
            const sendButton = $('send');
            const newButton = $('new');
            const picker = $('conversation');
            const detailsBox = $('details');

            // per browser: the details switch and the conversation that is open
            const remember = (key, value) => {
                try {
                    localStorage.setItem(`pi-agent-${key}`, value);
                } catch {
                    // private window: not remembered
                }
            };
            const recall = key => {
                try {
                    return localStorage.getItem(`pi-agent-${key}`) || '';
                } catch {
                    return '';
                }
            };
            let showDetails = recall('details') === '1';
            let selected = ''; // key of a conversation of someone else, '' = the own chat
            let conversations = [];

            const socket = io.connect('/', { path: `${location.pathname.split('/').slice(0, -3).join('/')}/socket.io` });
            const target = `pi-agent.${instance}`;
            let state = { running: true, busy: false, entries: [] };
            let offline = false;
            let pending = false; // a message was sent, the first answer of the server is not there yet
            let shown = '';
            let timer = null;

            function sendTo(command, message) {
                return new Promise(resolve => {
                    const guard = setTimeout(() => resolve({ error: 'offline' }), 15000);
                    socket.emit('sendTo', target, command, message || {}, answer => {
                        clearTimeout(guard);
                        resolve(answer || {});
                    });
                });
            }

            function escapeHtml(text) {
                return String(text).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
            }

            function item(cls, html) {
                const div = document.createElement('div');
                div.className = cls;
                div.innerHTML = html;
                return div;
            }

            const number = n => Number(n || 0).toLocaleString(lang);

            /** Name of a conversation in the list, e.g. "assistant.0 · kitchen". */
            function conversationLabel(c) {
                if (c.own) {
                    return t('myChat');
                }
                return c.kind === 'admin' ? `${t('adminChat')} · ${c.name}` : `${c.source} · ${c.name}`;
            }

            /** A tool call: short, or with arguments, the start of the result and the time. */
            function toolItem(entry) {
                const d = entry.detail;
                if (!showDetails || !d) {
                    return item('tool', escapeHtml(entry.text));
                }
                const ms = Number.isFinite(d.ms) ? ` <span class="ms">${number(d.ms)} ms</span>` : '';
                const result = d.result !== undefined ? ` → <span class="result">${escapeHtml(d.result)}</span>` : '';
                return item(`tool${d.error ? ' failed' : ''}`, `${escapeHtml(d.name)}(${escapeHtml(d.args)})${result}${ms}`);
            }

            /** The line under the answer of a request: provider, model, time, tokens. */
            function summaryItem(s) {
                const parts = [escapeHtml(s.model || '')];
                if (Number.isFinite(s.ms)) {
                    parts.push(`${(s.ms / 1000).toLocaleString(lang, { maximumFractionDigits: 1 })} s`);
                }
                parts.push(`${number(s.input)} in`, `${number(s.output)} out`, `${number(s.cached)} cached`);
                parts.push(escapeHtml(t('calls').replace('%n', number(s.calls))));
                return item('summary', `<span class="provider">${escapeHtml(s.provider || '')}</span>${parts.join(' · ')}`);
            }

            function render() {
                $('model').textContent = state.model || '';
                $('simulation').textContent = t('simulation');
                $('simulation').hidden = !state.simulation;
                const readOnly = Boolean(state.readOnly);
                const busy = state.busy || pending;
                sendButton.disabled = busy || offline || !state.running || readOnly;
                newButton.disabled = busy || offline || !state.running;
                newButton.hidden = readOnly;
                document.querySelector('footer').hidden = readOnly;

                const key = JSON.stringify([state, offline, pending, showDetails]);
                if (key === shown) {
                    return;
                }
                shown = key;
                const atBottom = messages.scrollHeight - messages.scrollTop - messages.clientHeight < 40;
                messages.textContent = '';
                if (offline) {
                    messages.append(item('msg error', escapeHtml(t('offline'))));
                } else if (!state.running) {
                    messages.append(item('msg error', escapeHtml(t('notRunning'))));
                } else if (readOnly) {
                    const c = conversations.find(x => x.key === state.conversation);
                    if (c) {
                        const text = t('readOnly')
                            .replace('%name', `<b>${escapeHtml(c.name)}</b>`)
                            .replace('%source', `<b>${escapeHtml(c.kind === 'admin' ? 'admin' : c.source)}</b>`);
                        messages.append(item('readonly', text));
                    }
                } else if (!state.entries.length && !busy) {
                    messages.append(item('hint', escapeHtml(t('empty'))));
                }
                for (const entry of state.entries || []) {
                    if (entry.role === 'user') {
                        messages.append(item('msg user', escapeHtml(entry.text)));
                    } else if (entry.role === 'tool') {
                        messages.append(toolItem(entry));
                    } else {
                        // HTML built by the adapter from escaped text (b, i, code, pre, http(s) links only)
                        messages.append(item(`msg ${entry.role === 'notice' ? 'notice' : 'assistant'}`, entry.html));
                        if (showDetails && entry.summary) {
                            messages.append(summaryItem(entry.summary));
                        }
                    }
                }
                if (state.question) {
                    const q = state.question;
                    let text;
                    if (String(q.action).startsWith('script')) {
                        // a script: the question, what pi-agent found in the code, and the change line by line
                        const v = q.val || {};
                        const key = q.action === 'scriptEnable' ? (v.enabled ? 'questionScriptStart' : 'questionScriptStop') : q.action === 'scriptRevert' ? 'questionScriptRevert' : v.isNew ? 'questionScriptNew' : 'questionScriptChange';
                        text = [
                            t(key).replace('%id', `<code>${escapeHtml(q.id)}</code>${v.isNew && v.engineType === 'TypeScript/ts' ? ' (TypeScript)' : ''}`),
                            ...(q.action === 'scriptSave' && v.running ? [escapeHtml(t('questionScriptRunning'))] : []),
                            ...(v.warnings || []).map(w => `⚠ ${escapeHtml(w)}`),
                        ].join('<br>');
                        if (v.diff) {
                            text += `<pre>${escapeHtml(v.diff)}</pre>`;
                        }
                    } else {
                        text = t(q.action === 'restart' ? 'questionRestart' : q.action === 'sendTo' ? 'questionSendTo' : q.action === 'update' ? 'questionUpdate' : 'question')
                            .replace('%id', `<code>${escapeHtml(q.id)}</code>`)
                            .replace('%val', `<code>${escapeHtml(q.action === 'sendTo' || q.action === 'update' ? String(q.val) : JSON.stringify(q.val))}</code>`);
                    }
                    const box = item('msg question', `⚠️ ${text}<div class="buttons"></div>`);
                    for (const answer of ['yes', 'no']) {
                        const button = document.createElement('button');
                        button.textContent = `${answer === 'yes' ? '✅' : '❌'} ${t(answer)}`;
                        button.onclick = () => confirmWrite(q.nonce, answer);
                        box.querySelector('.buttons').append(button);
                    }
                    messages.append(box);
                } else if (busy) {
                    messages.append(item('thinking', escapeHtml(t('thinking'))));
                }
                if (state.error) {
                    messages.append(item('msg error', escapeHtml(state.error)));
                }
                for (const a of messages.querySelectorAll('a')) {
                    a.target = '_blank';
                    a.rel = 'noopener noreferrer';
                }
                if (atBottom || pending) {
                    messages.scrollTop = messages.scrollHeight;
                }
            }

            const localTime = ts =>
                new Date(ts).toLocaleString(lang, { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });

            /** A trigger of a job in the language of the page. */
            function triggerLabel(tr) {
                if (tr.kind === 'daily') {
                    return t('triggerDaily').replace('%t', tr.time);
                }
                if (tr.kind === 'interval') {
                    return t('triggerInterval').replace('%n', number(tr.minutes));
                }
                const condition = tr.condition === 'changes' ? '≠' : `${tr.condition} ${JSON.stringify(tr.value)}`;
                const duration = tr.forMs ? ` ${t('triggerFor').replace('%n', number(Math.round(tr.forMs / 60000)))}` : '';
                return `${tr.stateId} ${condition}${duration}`;
            }

            /** Where the messages of a job go: "admin chat", "telegram.0", "voice: kitchen". */
            function targetLabel(key) {
                if (key === 'state') {
                    return 'chat.answer';
                }
                if (key.startsWith('voice:')) {
                    const m = /\.satellites\.([^.]+)\.tts$/.exec(key);
                    return `${t('voice')}${m ? `: ${m[1]}` : ''}`;
                }
                return key.startsWith('admin/') ? t('adminChat') : key.slice(0, key.lastIndexOf('/'));
            }

            const jobsBox = $('jobs');
            let jobsShown = '';
            let jobsCollapsed = recall('jobsCollapsed') === '1';

            /** The panel of the background jobs above the chat; hidden while there is none. */
            function renderJobs(jobs) {
                const list = Array.isArray(jobs) ? jobs : [];
                jobsBox.hidden = offline || list.length === 0;
                jobsBox.classList.toggle('collapsed', jobsCollapsed);
                const key = JSON.stringify([list, lang, jobsCollapsed]);
                if (key === jobsShown) {
                    return;
                }
                jobsShown = key;
                jobsBox.textContent = '';
                const head = item('head', `${jobsCollapsed ? '▸' : '▾'} <b>${escapeHtml(t('jobs'))}</b> <span class="count">${escapeHtml(t('jobCount').replace('%n', number(list.length)).replace('%m', '5'))}</span>`);
                head.onclick = () => {
                    jobsCollapsed = !jobsCollapsed;
                    remember('jobsCollapsed', jobsCollapsed ? '1' : '');
                    renderJobs(list);
                };
                jobsBox.append(head);
                for (const job of list) {
                    const meta = [
                        t('jobUntil').replace('%t', localTime(job.until)),
                        t('jobToday').replace('%n', number(job.wakesToday)).replace('%m', number(job.maxWakes)),
                        ...(job.last ? [t('jobLast').replace('%t', localTime(job.last))] : []),
                        job.notify.map(targetLabel).join(', '),
                    ];
                    const row = item(
                        'job',
                        `<div class="text"><div><span class="name">${escapeHtml(job.name)}</span><span class="status${job.paused ? ' paused' : ''}">${escapeHtml(t(job.paused ? 'jobPaused' : 'jobRunning'))}</span></div><div class="triggers">${escapeHtml(job.triggers.map(triggerLabel).join(' · '))}</div><div class="meta">${escapeHtml(meta.join(' · '))}</div></div><div class="buttons"></div>`,
                    );
                    row.querySelector('.text').title = job.lastReason ? `${job.task}\n\n${job.lastReason}` : job.task;
                    const buttons = row.querySelector('.buttons');
                    if (job.paused) {
                        const resume = document.createElement('button');
                        resume.textContent = t('jobResume');
                        resume.onclick = () => jobCommand('chatJobResume', job.id);
                        buttons.append(resume);
                    }
                    const stop = document.createElement('button');
                    stop.textContent = t('jobStop');
                    stop.onclick = () => confirm(t('confirmJobStop').replace('%name', job.name)) && jobCommand('chatJobStop', job.id);
                    buttons.append(stop);
                    jobsBox.append(row);
                }
            }

            async function jobCommand(command, id) {
                const answer = await sendTo(command, { id });
                if (Array.isArray(answer.jobs)) {
                    renderJobs(answer.jobs);
                }
            }

            async function refresh() {
                clearTimeout(timer);
                const answer = await sendTo('chatHistory', selected ? { conversation: selected } : {});
                if (answer.error === 'forbidden' || answer.error === 'unknownConversation') {
                    // the conversation is gone, or the user may not read it: back to the own chat
                    selectConversation('');
                    return;
                }
                offline = Boolean(answer.error);
                if (!offline) {
                    state = answer;
                    pending = false;
                }
                render();
                renderJobs(state.jobs);
                // fast while the agent works, slowly otherwise (reminders, other sessions, requests of other sources)
                timer = setTimeout(refresh, state.busy || state.question ? 1500 : selected ? 3000 : 10000);
            }

            /** The list of conversations; shown only when there is more than the own chat (administrators). */
            async function loadConversations() {
                const answer = await sendTo('chatConversations');
                if (!Array.isArray(answer.conversations)) {
                    return;
                }
                conversations = answer.conversations;
                picker.textContent = '';
                for (const c of conversations) {
                    const option = document.createElement('option');
                    option.value = c.own ? '' : c.key;
                    option.textContent = conversationLabel(c);
                    picker.append(option);
                }
                if (selected && !conversations.some(c => c.key === selected)) {
                    selected = '';
                }
                picker.value = selected;
                picker.hidden = conversations.length < 2;
            }

            function selectConversation(key) {
                selected = key;
                remember('conversation', key);
                picker.value = key;
                state = { running: true, busy: false, entries: [] };
                shown = '';
                refresh();
            }

            picker.addEventListener('mousedown', loadConversations);
            picker.addEventListener('change', () => selectConversation(picker.value));
            detailsBox.checked = showDetails;
            detailsBox.addEventListener('change', () => {
                showDetails = detailsBox.checked;
                remember('details', showDetails ? '1' : '');
                render();
            });

            async function send() {
                const text = input.value.trim();
                if (!text || sendButton.disabled) {
                    return;
                }
                input.value = '';
                autosize();
                state = { ...state, error: null, entries: [...(state.entries || []), { role: 'user', text }] };
                pending = true;
                render();
                const answer = await sendTo('chatSend', { text });
                if (answer.error) {
                    pending = false;
                    state = { ...state, error: answer.error === 'busy' ? t('busy') : answer.error === 'notRunning' ? t('notRunning') : answer.error };
                    render();
                }
                setTimeout(refresh, 500);
            }

            async function confirmWrite(nonce, answer) {
                await sendTo('chatConfirm', { nonce, answer });
                refresh();
            }

            function autosize() {
                input.style.height = 'auto';
                input.style.height = `${Math.min(input.scrollHeight + 2, 160)}px`;
            }

            input.addEventListener('keydown', e => {
                if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
                    e.preventDefault();
                    send();
                }
            });
            input.addEventListener('input', autosize);
            sendButton.onclick = send;
            newButton.onclick = async () => {
                if (confirm(t('confirmNew'))) {
                    await sendTo('chatNew');
                    refresh();
                }
            };

            function applyLanguage() {
                newButton.textContent = `+ ${t('newConversation')}`;
                sendButton.textContent = t('send');
                input.placeholder = t('placeholder');
                $('detailsLabel').textContent = t('details');
                for (const option of picker.options) {
                    const c = conversations.find(x => (x.own ? '' : x.key) === option.value);
                    if (c) {
                        option.textContent = conversationLabel(c);
                    }
                }
                shown = '';
                jobsShown = '';
                render();
                renderJobs(state.jobs);
            }

            socket.on('connect', async () => {
                socket.emit('getObject', 'system.config', (err, obj) => {
                    if (!err && obj && obj.common && LANGS.includes(obj.common.language)) {
                        lang = obj.common.language;
                    }
                    applyLanguage();
                });
                selected = recall('conversation');
                await loadConversations();
                refresh();
            });
            socket.on('disconnect', () => {
                offline = true;
                render();
                renderJobs([]);
            });
            applyLanguage();
        </script>
    </body>
</html>
